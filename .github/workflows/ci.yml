name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Type check
      run: yarn type-check
    - name: Test
      run: yarn test --testPathIgnorePatterns 'MinecraftServer'
    - name: Build
      run: yarn build

  generate-version-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
    # use the locked mineflayer so the matrix only has versions the test bots can join
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Generate version matrix
      id: generate
      run: bun run tests/versionMatrix.ts

  server:
    runs-on: ubuntu-latest
    needs: [generate-version-matrix]
    timeout-minutes: 5
    strategy:
      matrix: ${{ fromJson(needs.generate-version-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '22.x'
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.javaVersion }}
        java-package: jdk
    - name: Install packages
      run: yarn install --frozen-lockfile
    - name: Test
      run: yarn test -t 'MinecraftServer'
      env:
        MC_VERSION: ${{ matrix.mcVersion }}

  # publish the image that Watchtower on the server pulls; only after the unit tests pass on master
  publish:
    runs-on: ubuntu-24.04-arm   # the server is an arm64 Mac mini; native runner, no QEMU
    needs: [test]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/andreighita2002/discord-mc-bridge
        tags: |
          type=raw,value=latest
          type=sha
    - uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
